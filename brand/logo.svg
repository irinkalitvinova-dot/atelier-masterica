<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 88" role="img" aria-label="Ателье Мастерица">
  <!-- эмблема: жёлтая рамка (цвет ленты), две катушки с нитками и иголка -->
  <rect x="2" y="4" width="76" height="76" rx="3" fill="#F4C430" stroke="#2B3F66" stroke-width="2"/>
  <g stroke="#2B3F66" stroke-width="1.2">
    <path d="M10 5v6M18 5v4M26 5v6M34 5v4M42 5v6M50 5v4M58 5v6M66 5v4M74 5v6"/>
  </g>

  <!-- катушка 1: красная нитка -->
  <rect x="12" y="26" width="26" height="5" rx="1.5" fill="#E9E2D0" stroke="#2B3F66" stroke-width="1.2"/>
  <rect x="15" y="31" width="20" height="27" fill="#C8362F" stroke="#2B3F66" stroke-width="1.2"/>
  <path d="M15 36h20M15 41h20M15 46h20M15 51h20" stroke="#8f2420" stroke-width="1"/>
  <rect x="12" y="58" width="26" height="5" rx="1.5" fill="#E9E2D0" stroke="#2B3F66" stroke-width="1.2"/>

  <!-- катушка 2: бирюзовая нитка -->
  <rect x="42" y="38" width="26" height="5" rx="1.5" fill="#E9E2D0" stroke="#2B3F66" stroke-width="1.2"/>
  <rect x="45" y="43" width="20" height="22" fill="#1FA39A" stroke="#2B3F66" stroke-width="1.2"/>
  <path d="M45 48h20M45 53h20M45 58h20" stroke="#146c66" stroke-width="1"/>
  <rect x="42" y="65" width="26" height="5" rx="1.5" fill="#E9E2D0" stroke="#2B3F66" stroke-width="1.2"/>

  <!-- иголка с фиолетовой ниткой -->
  <line x1="14" y1="76" x2="64" y2="14" stroke="#2B3F66" stroke-width="2.4" stroke-linecap="round"/>
  <ellipse cx="62.4" cy="16.2" rx="1.2" ry="3" transform="rotate(38 62.4 16.2)" fill="#F4C430" stroke="#2B3F66" stroke-width="1"/>
  <path d="M62.4 16.2C74 20 72 34 60 31 50 29 46 24 52 21" fill="none" stroke="#8E3FB0" stroke-width="2" stroke-linecap="round"/>

  <text x="100" y="50" font-family="Prata, Georgia, serif" font-size="38" fill="#1D3A6B">Мастерица</text>
  <text x="102" y="70" font-family="Golos Text, Arial, sans-serif" font-size="11.5" letter-spacing="1.5" fill="#2B3F66">ПОШИВ И РЕМОНТ ОДЕЖДЫ</text>
</svg>

